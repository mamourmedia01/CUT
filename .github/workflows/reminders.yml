name: Reminders
# Pings the "reminders" Supabase Edge Function once an hour. It needs no secrets:
# the database address and public key come from config.js, and the function holds the push key itself.
# The hourly traffic also stops the free Supabase project from pausing.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: config.js, sparse-checkout-cone-mode: false }
      - name: Run reminders
        run: |
          URL=$(sed -n "s/.*SUPABASE_URL: *'\([^']*\)'.*/\1/p" config.js)
          KEY=$(sed -n "s/.*SUPABASE_ANON_KEY: *'\([^']*\)'.*/\1/p" config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Database not connected in config.js yet."; exit 0; fi
          curl -sS --fail-with-body -X POST "${URL%/}/functions/v1/reminders?action=run" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
      # GitHub pauses scheduled workflows after 60 days without commits; re-enabling keeps it alive for free.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/reminders.yml/enable || true
        env: { GH_TOKEN: '${{ github.token }}' }
