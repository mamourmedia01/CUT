name: CutLogSync
options:
  bundleIdPrefix: com.mamourmedia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  CutLogSync:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - sdk: HealthKit.framework
      - sdk: BackgroundTasks.framework
    info:
      path: SupportFiles/Info.plist
      properties:
        CFBundleDisplayName: Cut Log Sync
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: >-
          Cut Log Sync reads your Apple Watch and iPhone health data (heart rate, HRV,
          steps, calories, exercise, workouts, sleep and weight) and sends it to your own
          private Cut Log database, so your recovery, strain and sleep are always up to date.
        NSHealthUpdateUsageDescription: Cut Log Sync never writes to Apple Health.
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.mamourmedia.cutlogsync.refresh
        CFBundleURLTypes:
          - CFBundleURLName: com.mamourmedia.cutlogsync
            CFBundleURLSchemes:
              - cutlogsync
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: SupportFiles/CutLogSync.entitlements
      properties:
        com.apple.developer.healthkit: true
schemes:
  CutLogSync:
    build:
      targets:
        CutLogSync: all
